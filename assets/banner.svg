<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#FF0080"/>
      <stop offset="100%" stop-color="#00DFD8"/>
    </linearGradient>
    
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Pulse Animation -->
    <style>
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-15px) translateX(10px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      .bg-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
      .flow-line { stroke-dasharray: 8 8; animation: dashAnim 2s linear infinite; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Dynamic Glow Circles in Background (Behind Text) -->
  <circle cx="200" cy="100" r="180" fill="url(#primaryGrad)" opacity="0.15" filter="url(#glow)" class="bg-pulse"/>
  <circle cx="1000" cy="300" r="220" fill="url(#accentGlow)" opacity="0.3" filter="url(#glow)" class="bg-pulse"/>

  <!-- Tech Grid Overlay (Subtle Background Pattern) -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)"/>
  </g>

  <!-- Decorative Animated Neural Network Connections (Background side elements) -->
  <g stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.4" class="particle-1">
    <line x1="80" y1="320" x2="220" y2="280" class="flow-line"/>
    <line x1="220" y1="280" x2="160" y2="360" class="flow-line"/>
    <circle cx="80" cy="320" r="4" fill="#FF0080"/>
    <circle cx="220" cy="280" r="6" fill="#00DFD8"/>
    <circle cx="160" cy="360" r="5" fill="#7928CA"/>
  </g>

  <g stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.4" class="particle-2">
    <line x1="980" y1="80" x2="1100" y2="140" class="flow-line"/>
    <line x1="1100" y1="140" x2="1040" y2="220" class="flow-line"/>
    <circle cx="980" cy="80" r="5" fill="#00DFD8"/>
    <circle cx="1100" cy="140" r="6" fill="#FF0080"/>
    <circle cx="1040" cy="220" r="4" fill="#5865F2"/>
  </g>

  <!-- Center Card Badge (Semi-transparent backdrop to ensure clear text foreground) -->
  <rect x="150" y="60" width="900" height="280" rx="16" fill="#161b22" fill-opacity="0.75" stroke="url(#primaryGrad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Foreground Title and Subtitles (High contrast, clearly visible) -->
  <g text-anchor="middle">
    <!-- Top Pill Tag -->
    <rect x="460" y="90" width="280" height="32" rx="16" fill="url(#primaryGrad)" opacity="0.9"/>
    <text x="600" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="1.5">
      CURATED AI ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="0.5">
      Awesome AI Software Development Assistant 🤖⚡
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#c9d1d9">
      Commercial Platforms &amp; Open-Source Autonomous Agents Directory
    </text>

    <!-- Subtitle Line 2 (Feature tags) -->
    <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e">
      Code Completion • Agentic Workflows • CLI Tools • Context-Aware IDE Extensions
    </text>
  </g>
</svg>
